<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <script src="javascript.js" defer></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="game">
        <h1>Tic Tac Toe</h1>

        <div class="controls">
            <label>
                Player X
                <input id="player-one" type="text" value="Player 1">
            </label>

            <label>
                Player O
                <input id="player-two" type="text" value="Player 2">
            </label>

            <button class="start-button" type="button">Start Game</button>
        </div>

        <p class="status" aria-live="polite"></p>

        <div class="board"></div>
    </main>
</body>
</html>
